<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Soccer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <div class="team team-left">
          <span class="label">Home</span>
          <span id="score-left" class="score">0</span>
        </div>

        <div class="center-panel">
          <h1>Mini Soccer</h1>
          <p id="status">Press any key to kick off</p>
        </div>

        <div class="team team-right">
          <span class="label">Away</span>
          <span id="score-right" class="score">0</span>
        </div>
      </header>

      <canvas id="gameCanvas" width="960" height="540" aria-label="Mini soccer game"></canvas>
    </main>

    <script src="script.js"></script>
  </body>
</html>
